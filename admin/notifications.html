<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS360 | Admin Notifications</title>
    <link rel="stylesheet" href="notifications.css">

<script>
// CAMPUS360: block direct access without an authenticated admin session.
(function () {
  const token = sessionStorage.getItem("campus360AdminToken");
  const loggedIn = sessionStorage.getItem("campus360AdminLoggedIn") === "true";
  if (!token || !loggedIn) {
    sessionStorage.removeItem("campus360AdminToken");
    sessionStorage.removeItem("campus360AdminLoggedIn");
    window.location.replace("../pages/admin-login.html");
  }
})();
</script>
</head>
<body>

    <header>
        <h2>CAMPUS<span>360</span></h2>
        <a href="admin.html">← Back to Admin</a>
    </header>

    <main class="container">
        <h1>🔔 Notification Management</h1>
        <p>Manage campus announcements.</p>

        <section class="form-box">
            <h2>Send New Notification</h2>

            <form id="notificationForm">
                <input type="text" id="notificationTitle"
                    placeholder="Enter notification title" required>

                <textarea id="notificationMessage"
                    placeholder="Enter notification message" required></textarea>

                <select id="notificationCategory" required>
                    <option value="Announcement">Announcement</option>
                    <option value="Assignment">Assignment</option>
                    <option value="Attendance">Attendance</option>
                    <option value="Event">Event</option>
                    <option value="Result">Result</option>
                </select>

                <button type="submit">Send to All Students</button>
            </form>
        </section>

        <section class="notification-box">
            <h2>All Notifications</h2>
            <div id="notificationList"></div>
        </section>
    </main>

    <script src="../config.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
