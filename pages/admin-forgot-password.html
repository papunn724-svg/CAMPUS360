<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMPUS360 | Recover Admin Password</title><link rel="stylesheet" href="admin-login.css"></head><body><div class="login-container"><div class="login-box"><h1>CAMPUS<span>360</span></h1><p class="subtitle">Admin Password Recovery</p><form id="requestForm"><label>Registered Admin Email</label><input id="recoveryEmail" type="email" required placeholder="Enter admin email"><button class="login-btn">SEND RECOVERY CODE</button></form><form id="resetForm" hidden><label>6-digit recovery code</label><input id="recoveryCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><label>New password (10–128 characters)</label><input id="recoveryPassword" type="password" minlength="10" maxlength="128" required><button class="login-btn">RESET PASSWORD</button></form><p id="recoveryMessage" role="status"></p><a href="admin-login.html" class="back">← Back to Admin Login</a></div></div><script src="../config.js"></script><script src="admin-forgot-password.js"></script></body></html>
